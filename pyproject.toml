[project]
name = "projects-dashboard-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Liana Kalpakchyan",email = "kalpakchyanliana@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.19.0,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "boto3 (>=1.43.64,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pillow (>=12.3.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "moto (>=5.2.2,<6.0.0)",
    "faker (>=40.36.0,<41.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "types-boto3-s3 (>=1.43.66,<2.0.0)",
    "pytest-env (>=1.7.0,<2.0.0)",
    "tox (>=4.60.0,<5.0.0)"
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q --cov=app --cov=lambdas --cov-report=term-missing"
testpaths = ["tests", "lambdas/tests"]
asyncio_mode = "auto"
env = [
    "ENV=test",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.poetry]
name = "projects-dashboard-api"
version = "0.1.0"
description = ""
readme = "README.md"
packages = [
    { include = "app" }
]
